
name: Add-ons

on:
  pull_request:
    paths: ["addons/**"]
  push:
    branches: [main]
    paths: ["addons/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build changed add-ons
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build each add-on that changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- addons | awk -F/ 'NF>2 {print $2}' | sort -u)
          [ -z "$changed" ] && { echo "no add-on changed"; exit 0; }

          for a in $changed; do
            [ -d "addons/$a" ] || continue
            [ -f "addons/$a/gradlew" ] || { echo "addons/$a has no gradlew"; exit 1; }

            echo "::group::addons/$a"
            (cd "addons/$a" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease)
            echo "::endgroup::"
          done
